name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # The WebView shell that talks to a DSH instance running on a computer.
  shell-apk:
    name: webview shell APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub's Linux image ships the SDK, but `android-actions/setup-android`
      # fails on it (its `sdkmanager tools` package is gone). Install the two
      # pieces the build actually needs instead.
      - name: ensure SDK packages
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: assembleRelease
        run: gradle -p dsh-mobile assembleRelease --no-daemon --console=plain

      - name: verify APK
        run: |
          set -eu
          APK=$(find dsh-mobile/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" > build-badging.txt
          sed -n '1,6p' build-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" > build-signature.txt
          sed -n '1,6p' build-signature.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-shell-apk
          path: dsh-mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # The self-contained build: Android aarch64 Node runtime + pruned DSH tree are
  # baked into the APK, so the phone runs DSH without a computer.
  local-apk:
    name: on-device APK (bundled runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ensure SDK packages
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: fetch aarch64 Node runtime (Termux packages)
        run: python tools/fetch-android-runtime.py dsh-android/payload/runtime

      - name: install DSH tree
        run: npm install --prefix build/dsh-tree @deepseek-ai/dsh@0.2.2-rc.1 --no-audit --no-fund --loglevel=error

      - name: compose profile and prune payload
        run: |
          set -euo pipefail
          DSH_TREE="$PWD/build/dsh-tree/node_modules/@deepseek-ai/dsh"
          export DSH_HOME="$PWD/build/home"
          node "$DSH_TREE/lib/bin.js" --profile web --dump-config > build/dump-config.txt
          node tools/collect-runtime-deps.mjs build/dump-config.txt "$DSH_TREE" build/deps.json
          node tools/build-payload.mjs build/deps.json "$DSH_TREE" dsh-android/payload/dsh

      - name: stage shim and profile seed
        run: |
          set -euo pipefail
          mkdir -p dsh-android/payload/tools dsh-android/payload/profile
          cp tools/android-native-addon-shim.cjs tools/android-addon-preload.cjs dsh-android/payload/tools/
          cp -r build/home/profiles dsh-android/payload/profile/

      - name: pack payload archive
        run: python tools/pack-payload.py dsh-android/payload dsh-android/app/src/main/assets/payload.zip

      - name: assembleRelease
        run: gradle -p dsh-android assembleRelease --no-daemon --console=plain

      - name: verify APK
        if: always()
        run: |
          set -eu
          APK=$(find dsh-android/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          echo "APK=$APK"
          if [ -f "$APK" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" > build-badging.txt
            sed -n '1,6p' build-badging.txt
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" > build-signature.txt
            sed -n '1,6p' build-signature.txt
            unzip -l "$APK" > build-contents.txt
            tail -n 6 build-contents.txt
            ls -lh "$APK"
          else
            echo "no APK produced"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-local-apk
          retention-days: 3
          path: |
            dsh-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
