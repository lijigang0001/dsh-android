org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Parallel writes and the local build cache both proved unreliable on this
# workspace volume: a merged .flat came back with torn content ("magic value is
# 0x1a031b18 but AAPT expects 0x54504141"). Keep the build serial and uncached.
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
