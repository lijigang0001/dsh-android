org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The local endpoint agent encrypts java.exe writes, which corrupts AGP's
# resource-merge intermediates; tools/build-dsh-android.ps1 drives aapt2/javac/d8
# directly instead. Keep Gradle serial and uncached for machines where it does run.
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
